name: CI
on:
  pull_request:
  push:
    branches: [main, 'ci/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Unit tests only (vitest, src/**/*.test.ts). Playwright e2e (npm run test:e2e)
      # is not part of this baseline.
      - run: npm test
